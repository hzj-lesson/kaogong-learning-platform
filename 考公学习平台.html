<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考公学习平台 · 2028 国考冲刺版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='bold'%3E%E6%95%B0%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4f6fa;--card:#ffffff;--ink:#1b2230;--ink-2:#49536a;--ink-3:#8a93a8;
    --line:#e3e8f0;--accent:#2563eb;--accent-soft:#eaf0fe;
    --red:#d93025;--red-soft:#fdeeec;--green:#0f9d58;--green-soft:#e8f6ef;
    --amber:#c77700;--amber-soft:#fff4e0;--purple:#6b3fa0;--purple-soft:#f2ecfa;
    --shadow:0 1px 3px rgba(20,30,60,.06),0 6px 22px rgba(20,30,60,.05);
    --r:14px;
  }
  [data-theme="dark"]{
    --bg:#12161f;--card:#1b2130;--ink:#e8ecf5;--ink-2:#aab3c7;--ink-3:#6b7590;
    --line:#2a3247;--accent:#5b8def;--accent-soft:#1d2a49;
    --red-soft:#3a1f1c;--green-soft:#12291e;--amber-soft:#33270e;--purple-soft:#261b38;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 22px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    line-height:1.7;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
  .wrap{max-width:1100px;margin:0 auto;padding:0 18px 80px}

  /* top bar */
  .top{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-size:19px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .brand .dot{width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:inline-block}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .count-chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink-2);box-shadow:var(--shadow)}
  .count-chip b{color:var(--accent);font-variant-numeric:tabular-nums}
  .theme-btn{border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;transition:.2s}
  .theme-btn:hover{border-color:var(--accent);color:var(--accent)}

  /* tabs */
  .tabs{display:flex;gap:4px;margin:16px 0 20px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto;box-shadow:var(--shadow)}
  .tab{flex:1;min-width:92px;text-align:center;padding:9px 6px;border:none;background:transparent;color:var(--ink-3);font-size:13.5px;font-weight:700;border-radius:9px;cursor:pointer;transition:.2s;white-space:nowrap}
  .tab:hover{color:var(--ink-2);background:var(--bg)}
  .tab.active{background:var(--accent);color:#fff}
  .tab .ic{display:block;font-size:15px;margin-bottom:2px}
  @media(max-width:640px){.tab{min-width:74px;font-size:12px}}

  main section{display:none}
  main section.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  h2.sec{font-size:19px;margin:6px 0 4px;letter-spacing:-.01em}
  p.sub{color:var(--ink-3);font-size:13.5px;margin:0 0 16px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}

  /* dashboard */
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:16px}
  .stat{padding:16px 18px}
  .stat .k{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ink-3);margin-bottom:6px}
  .stat .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:13px;color:var(--ink-3);font-weight:600}
  .stat .d{font-size:12.5px;color:var(--ink-3);margin-top:4px}
  .ring-wrap{display:flex;align-items:center;gap:18px}
  .ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;flex:none}
  .ring .rv{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .ring .rl{font-size:11px;color:var(--ink-3)}
  .today{flex:1;min-width:240px}
  .today h4{margin:0 0 10px;font-size:14.5px}
  .todo-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;color:var(--ink-2)}
  .todo-item:last-child{border-bottom:none}
  .todo-item .no{flex:none;width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:800;display:grid;place-items:center}
  .empty-hint{color:var(--ink-3);font-size:13.5px;padding:8px 0}
  .btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.2s}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn.small{padding:6px 11px;font-size:12.5px;border-radius:8px}

  /* stages / tasks */
  .stage{margin-bottom:14px;overflow:hidden}
  .stage-hd{display:flex;align-items:center;gap:13px;padding:13px 18px;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
  .stage-hd .badge{font-size:11px;font-weight:800;color:#fff;background:var(--ink);border-radius:7px;padding:3px 9px;letter-spacing:.05em;flex:none}
  .stage-hd h3{margin:0;font-size:15.5px;flex:1}
  .stage-hd .when{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
  .stage-hd .pct{font-size:12.5px;font-weight:800;color:var(--accent);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
  .stage-hd .arrow{color:var(--ink-3);font-size:12px;transition:transform .2s}
  .stage.collapsed .arrow{transform:rotate(-90deg)}
  .stage-bd{display:none;padding:6px 18px 14px}
  .stage:not(.collapsed) .stage-bd{display:block}
  .task{display:flex;align-items:flex-start;gap:11px;padding:9px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
  .task:last-child{border-bottom:none}
  .task input[type=checkbox]{width:17px;height:17px;margin-top:4px;accent-color:var(--accent);cursor:pointer;flex:none;pointer-events:none}
  .task .t-main{flex:1}
  .task .t-name{font-size:14.3px;font-weight:600}
  .task .t-desc{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .task.done .t-name{text-decoration:line-through;color:var(--ink-3)}
  .task .t-est{font-size:11.5px;color:var(--ink-3);flex:none;margin-top:3px}

  .sbar{background:var(--bg);border-radius:8px;height:14px;overflow:hidden;border:1px solid var(--line)}
  .sbar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);border-radius:8px;transition:width .4s}

  /* pomodoro */
  .pomo{display:flex;flex-direction:column;align-items:center;padding:30px 20px;gap:6px}
  .pomo-ring{width:230px;height:230px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent) 0deg,var(--bg) 0deg);transition:background .1s}
  .pomo-ring::before{content:"";position:absolute;inset:14px;background:var(--card);border-radius:50%;border:1px solid var(--line)}
  .pomo-inner{position:relative;text-align:center}
  .pomo-time{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .pomo-mode{font-size:13px;color:var(--ink-3);font-weight:700}
  .pomo-round{font-size:12px;color:var(--ink-3);margin-top:2px}
  .pomo-ops{display:flex;gap:10px;margin-top:16px}
  .pomo-modes{display:flex;gap:6px;margin-top:14px}
  .mode-btn{border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
  .mode-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .pomo-tip{max-width:520px;text-align:center;font-size:13px;color:var(--ink-3);margin-top:14px}

  /* notes */
  .notes-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.notes-grid{grid-template-columns:1fr}}
  .notes-grid textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:13px;font-size:13.5px;font-family:inherit;line-height:1.7;resize:vertical}
  .notes-grid textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .log-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:13.8px}
  .log-item:last-child{border-bottom:none}
  .log-item .ld{flex:none;font-size:11.5px;color:var(--ink-3);font-weight:700;padding-top:3px;min-width:92px}
  .log-item .lt{flex:1;color:var(--ink-2);white-space:pre-wrap}
  .log-item .del{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:6px}
  .log-item .del:hover{background:var(--red-soft);color:var(--red)}
  .muted{color:var(--ink-3);font-size:12.5px}

  /* resources */
  .res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .res-card h4{margin:0 0 10px;font-size:14.5px}
  .res-card ul{margin:0;padding-left:2px;list-style:none}
  .res-card li{margin-bottom:9px;font-size:13.8px}
  .res-card a{color:var(--ink-2);text-decoration:none;font-weight:600;border-bottom:1px solid transparent}
  .res-card a:hover{color:var(--accent);border-color:var(--accent)}
  .res-card .rd{display:block;font-size:12px;color:var(--ink-3);font-weight:400}

  /* data mgmt */
  .data-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
  .data-bar .muted{margin-right:auto}

  /* modal */
  .modal-mask{position:fixed;inset:0;background:rgba(10,15,30,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:36px 16px;overflow:auto}
  .modal-mask.show{display:flex;animation:fade .2s ease}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:760px;width:100%;animation:slideup .25s ease}
  @keyframes slideup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .modal-hd{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);border-radius:16px 16px 0 0;z-index:2}
  .modal-hd .badge{font-size:11px;font-weight:800;color:#fff;background:var(--accent);border-radius:7px;padding:3px 9px;letter-spacing:.05em;flex:none}
  .modal-hd h3{margin:0;font-size:16.5px;flex:1}
  .modal-x{background:none;border:none;color:var(--ink-3);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px}
  .modal-x:hover{background:var(--red-soft);color:var(--red)}
  .modal-bd{padding:18px 22px 8px;font-size:14.5px;color:var(--ink-2);max-height:64vh;overflow:auto}
  .modal-bd h4{font-size:13px;letter-spacing:.05em;color:var(--ink-3);margin:16px 0 8px;font-weight:800}
  .modal-bd h4:first-child{margin-top:0}
  .modal-bd .intro{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--ink);margin-bottom:4px}
  .modal-bd details{background:var(--amber-soft);border:1px dashed #e2c98a;border-radius:10px;padding:10px 14px;margin:4px 0 6px}
  .modal-bd details summary{cursor:pointer;font-size:13.5px;font-weight:800;color:#8a5400;user-select:none}
  .modal-bd details summary:hover{opacity:.8}
  .modal-bd .terms-list{margin:8px 0 2px;padding:0;list-style:none}
  .modal-bd .terms-list li{padding:6px 0 6px 2px;font-size:13.5px;color:var(--ink);border-bottom:1px dashed rgba(194,164,90,.35)}
  .modal-bd .terms-list li:last-child{border-bottom:none}
  .modal-bd .terms-list li::before{content:"";display:none}
  .modal-bd .terms-list b{color:var(--amber);font-weight:800;background:rgba(255,255,255,.55);padding:1px 6px;border-radius:5px;margin-right:6px}
  .modal-bd .tl-eg{display:block;color:var(--ink-3);font-size:12.5px;margin-top:1px}
  .modal-bd ul{margin:0;padding-left:2px;list-style:none}
  .modal-bd ul li{position:relative;padding:5px 0 5px 20px;font-size:14px}
  .modal-bd ul li::before{content:"▸";position:absolute;left:2px;color:var(--accent);font-weight:800}
  .modal-bd ul li b{color:var(--ink)}
  .modal-bd code{background:var(--bg);border:1px solid var(--line);padding:1px 6px;border-radius:5px;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
  .modal-bd .pit{background:var(--amber-soft);border-radius:10px;padding:11px 14px;font-size:13.5px;color:#8a5400;margin-top:2px}
  .modal-bd .pit b{color:#5c3800}
  .modal-bd .quiz{background:var(--green-soft);border-radius:10px;padding:11px 14px;font-size:13.5px;color:#0b6b3f;margin-top:2px}
  .modal-bd .quiz b{color:#084a2c}
  .modal-ft{padding:12px 22px 18px;text-align:right}
  .kbtn{border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer;flex:none;transition:.15s}
  .kbtn:hover{background:var(--accent);color:#fff}
  .task .kbtn{margin-top:2px}
  .skill-row .kbtn{padding:4px 9px}

  /* 打卡 */
  .checkin-grid{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .ci{width:34px;height:44px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--ink-3);gap:2px}
  .ci.on{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:800}
  .ci .d{font-size:13px;font-weight:700}
  .ci .w{font-size:9px}
  .ci.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  /* 掌握度 */
  .mbtn{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink-3);font-size:11px;cursor:pointer;margin-top:2px;display:grid;place-items:center;font-weight:800;transition:.15s}
  .mbtn[data-m="1"]{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
  .mbtn[data-m="2"]{border-color:var(--green);color:var(--green);background:var(--green-soft)}
  .mbtn[data-m="3"]{border-color:#b8860b;color:#b8860b;background:#fdf6e3}
  .mbtn:hover{transform:scale(1.12)}
  .mastery-bar{display:flex;gap:8px;margin:4px 0 10px}
  .m-choice{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--ink-3);cursor:pointer;transition:.15s}
  .m-choice[data-m="0"]:hover,.m-choice[data-m="0"].sel{border-color:var(--ink-3);color:var(--ink)}
  .m-choice[data-m="1"]:hover,.m-choice[data-m="1"].sel{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
  .m-choice[data-m="2"]:hover,.m-choice[data-m="2"].sel{border-color:var(--green);color:var(--green);background:var(--green-soft)}
  .m-choice[data-m="3"]:hover,.m-choice[data-m="3"].sel{border-color:#b8860b;color:#b8860b;background:#fdf6e3}
  .wrong-btn{width:100%;border:1.5px dashed var(--red);background:var(--red-soft);color:var(--red);border-radius:9px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;margin-top:2px}
  .wrong-btn:hover{background:var(--red);color:#fff}
  /* 深入学习板块 */
  .deep{background:var(--blue-soft);border-radius:10px;padding:12px 16px;font-size:14px;color:var(--ink-2);margin-bottom:10px}
  .deep b{color:var(--accent)}
  .deep-hd{font-size:13px;font-weight:800;color:var(--ink-3);letter-spacing:.04em;margin:2px 0 6px}
  .deep-tasks{list-style:none;margin:0;padding:0}
  .deep-tasks li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;color:var(--ink-2)}
  .deep-tasks li:last-child{border-bottom:none}
  .deep-tasks label{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
  .deep-tasks input[type=checkbox]{width:16px;height:16px;margin-top:4px;accent-color:var(--green);flex:none;cursor:pointer}
  .deep-tasks li.on span{text-decoration:line-through;color:var(--ink-3)}
  /* 作品化模板（deep.tpl） */
  .deep-tpl{background:var(--card);border:1.5px dashed var(--accent);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink-2);margin-bottom:10px}
  .deep-tpl b{color:var(--accent)}
  /* 折叠式参考答案 */
  .q-ans{margin:4px 0 2px;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:0}
  .q-ans summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--green);padding:8px 12px;user-select:none;list-style:none;display:flex;align-items:center;gap:6px}
  .q-ans summary::before{content:"👀"}
  .q-ans[open] summary{border-bottom:1px dashed var(--line)}
  .q-ans .a-body{padding:10px 12px;font-size:13.5px;color:var(--ink-2)}
  .q-ans .a-body b{color:var(--ink)}
  .q-follow{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink-3)}
  .q-follow b{color:var(--amber)}
  /* 搜索 */
  .search-wrap{position:relative;flex:1;min-width:180px;max-width:340px}
  .search-input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px 8px 34px;font-size:13.5px;color:var(--ink);outline:none;transition:.2s}
  .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink-3);pointer-events:none}
  .search-res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(10,20,50,.18);max-height:340px;overflow:auto;z-index:60;display:none}
  .search-res.show{display:block}
  .sr-item{padding:9px 14px;font-size:13.5px;cursor:pointer;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:baseline}
  .sr-item:last-child{border-bottom:none}
  .sr-item:hover{background:var(--accent-soft)}
  .sr-item .sg{flex:none;font-size:10.5px;font-weight:800;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .sr-item .st{color:var(--ink-2)}
  .sr-empty{padding:12px 14px;font-size:13px;color:var(--ink-3)}
  /* 备份提醒 */
  .tip-bar{display:flex;align-items:center;gap:10px;background:var(--amber-soft);border:1px solid #e2c98a;border-radius:12px;padding:10px 16px;font-size:13.5px;color:#8a5400;margin-bottom:14px;flex-wrap:wrap}
  .tip-bar b{color:#5c3800}
  .tip-bar .x{margin-left:auto;background:none;border:none;color:#8a5400;cursor:pointer;font-size:15px}
  /* 错题本 */
  .wrong-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.8px}
  .wrong-item:last-child{border-bottom:none}
  .wrong-item .wi{flex:1;color:var(--ink-2)}
  .wrong-item .wi b{color:var(--red)}
  .wrong-item .wd{font-size:11.5px;color:var(--ink-3);white-space:nowrap;margin-top:2px}
  .wrong-item .btn{padding:4px 9px;font-size:12px}
  .wrong-item .wr{display:inline-block;font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}

function daysTo(ts){ const d = Math.ceil((new Date(ts).setHours(0,0,0,0) - new Date().setHours(0,0,0,0))/86400000); return d; }
function renderCd(id, ts, label){

function fmtDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function todayStr(){ return fmtDate(new Date()); }
function monthCount(){
  const pre = todayStr().slice(0,7);
  return Object.keys(state.checkins).filter(k=>String(k).slice(0,7)===pre).length;
}
function week8Count(){
  let n=0;
  for(let i=0;i<182;i++){ const d=new Date(); d.setDate(d.getDate()-i); if(state.checkins[fmtDate(d)]) n++; }
  return n;
}
function heatCells(){
  const now = new Date();
  const start = new Date(); start.setDate(now.getDate() - 181); /* 26 周 */
  start.setDate(start.getDate() - (start.getDay()+6)%7); /* 对齐到周一 */
  let html = "";
  for(let w=0; w<26; w++){
    html += '<div class="heat-col">';
    for(let d=0; d<7; d++){
      const dd = new Date(start); dd.setDate(start.getDate()+w*7+d);
      if(dd > now){ html += '<i class="ht off"></i>'; continue; }
      html += `<i class="ht ${state.checkins[fmtDate(dd)]?"on":""}"></i>`;
    }
    html += '</div>';
  }
  return html;
}
/* 任务名查询 */
function taskName(id){
  const [sid, idx] = id.split("_");
  const st = STAGES.find(s=>s.id===sid);
  return st ? st.tasks[+idx][0] : id;
}
/* 薄弱任务：同一任务错题 ≥2 道 */
function weakTasks(){
  const cnt = {};
  state.wrong.forEach(w=>{ if(w.key) cnt[w.key]=(cnt[w.key]||0)+1; });
  return Object.entries(cnt).filter(([,n])=>n>=2).map(([id,n])=>({ id, n }));
}
/* 到期复习：任务完成后按 1/3/7 天记忆曲线提醒，复习后重新计时 */
function reviewDue(){
  const due = []; const now = Date.now(); const DAY = 86400000;
  for(const [id, r] of Object.entries(state.review||{})){
    if(!r || !r.doneAt) continue;
    const base = r.lastRev || r.doneAt;
    const el = now - base;
    const m = el >= 7*DAY ? 7 : el >= 3*DAY ? 3 : el >= 1*DAY ? 1 : 0;
    if(m) due.push({ id, m });
  }
  return due.sort((a,b)=>b.m-a.m).slice(0,6);
}

/* ============ 番茄钟 ============ */
const POMO = { work:25*60, short:5*60, long:15*60 };
const MODE_LABEL = { work:"专注", short:"短休息", long:"长休息" };
let pomo = { ...DEF.pomo, ...state.pomo };
let pomoTotal = store.get("bdlp_pomoTotal", 0);
let ticker = null;

/* 兼容旧数据：运行中但没有时间基准 → 按剩余秒数重建；时间已过 → 补记一次专注 */
if(pomo.running && !pomo.endAt){
  pomo.endAt = Date.now() + pomo.left*1000;
} else if(pomo.running && Date.now() >= pomo.endAt){
  if(pomo.mode === "work") pomoTotal += pomo.dur;
  pomo.running = false;
  pomo.round += (pomo.mode === "work") ? 1 : 0;
  pomo.mode = (pomo.round % 4 === 0) ? "long" : "short";
  pomo.dur = POMO[pomo.mode]; pomo.left = pomo.dur; delete pomo.endAt;
}
if(!pomo.running && pomo.endAt) delete pomo.endAt;

function pomoCommit(){ state.pomo = pomo; save(); store.set("bdlp_pomoTotal", pomoTotal); }
function beep(){
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const play = (freq, t0) => { const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = freq; o.type = "sine";
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.18, ctx.currentTime+t0);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+t0+.6);
      o.start(ctx.currentTime+t0); o.stop(ctx.currentTime+t0+.65);
    };
    play(880, 0); play(660, .35);
  } catch(e){}
}
function pomoNext(){
  if(pomo.mode === "work"){
    pomo.round++;
    pomo.mode = (pomo.round % 4 === 0) ? "long" : "short";
  } else { pomo.mode = "work"; }
  pomo.dur = POMO[pomo.mode]; pomo.left = pomo.dur; delete pomo.endAt;
  beep(); toast(`进入${MODE_LABEL[pomo.mode]} ${Math.round(pomo.dur/60)} 分钟`);
  pomoCommit(); renderPomo();
}
function pomoTick(){
  if(!pomo.running) return;
  /* 以 endAt 时间戳校准剩余时间：标签页后台被节流、电脑休眠都不会丢秒 */
  pomo.left = Math.max(0, Math.round((pomo.endAt - Date.now())/1000));
  if(pomo.left <= 0){
    if(pomo.mode === "work") pomoTotal += pomo.dur;
    clearInterval(ticker); ticker = null; pomo.running = false; delete pomo.endAt;
    pomoCommit(); pomoNext(); return;
  }
  updatePomoClock(); /* 仅更新界面，不再每秒写 localStorage */
}
function updatePomoClock(){
  const el = $("#pomoTime");
  if(!el) return;
  const m = String(Math.floor(pomo.left/60)).padStart(2,"0"), s = String(pomo.left%60).padStart(2,"0");
  el.textContent = `${m}:${s}`;
  const ring = $("#pomoRing");
  if(ring) ring.style.background = `conic-gradient(var(--accent) ${(pomo.dur-pomo.left)/pomo.dur*360}deg, var(--bg) 0deg)`;
}
function renderPomo(){
  const tip = ["第 1 个番茄：只做一件事，手机静音放远", "连续 4 个番茄后长休息 15 分钟", "番茄钟不是用来'熬'的，是用来进入心流的", "休息时离开屏幕：喝水、走动、看远处"][pomo.round % 4];
  $("#main").innerHTML = `
  <section class="active">
    <h2 class="sec">番茄钟</h2>
    <p class="sub">25 分钟专注 + 5 分钟休息 · 每 4 轮长休息 · 累计 ${Math.round(pomoTotal/60)} min</p>
    <div class="card pomo">
      <div class="pomo-ring" id="pomoRing"><div class="pomo-inner">
        <div class="pomo-time" id="pomoTime">-</div>
        <div class="pomo-mode">${MODE_LABEL[pomo.mode]} ${Math.round(pomo.dur/60)} 分钟</div>
        <div class="pomo-round">第 ${Math.max(pomo.round,1)} 轮 · 累计 ${Math.round(pomoTotal/60)} 分钟</div>
      </div></div>
      <div class="pomo-ops">
        <button class="btn primary" id="pomoStart">${pomo.running?"暂停":"开始"}</button>
        <button class="btn ghost" id="pomoReset">重置本轮</button>
        <button class="btn ghost" id="pomoSkip">跳过</button>
      </div>
      <div class="pomo-modes">
        <button class="mode-btn ${pomo.mode==="work"?"on":""}" data-m="work">专注 25'</button>
        <button class="mode-btn ${pomo.mode==="short"?"on":""}" data-m="short">短休 5'</button>
        <button class="mode-btn ${pomo.mode==="long"?"on":""}" data-m="long">长休 15'</button>
      </div>
      <div class="pomo-tip">💡 ${tip}</div>
    </div>
  </section>`;
  updatePomoClock();
  $("#pomoStart").addEventListener("click", ()=>{
    if(pomo.running){
      /* 暂停：按时间戳算出剩余秒数并停表 */
      pomo.left = Math.max(0, Math.round((pomo.endAt - Date.now())/1000));
      pomo.running = false; clearInterval(ticker); ticker = null; delete pomo.endAt;
    } else {
      pomo.running = true;
      pomo.endAt = Date.now() + pomo.left*1000;
      if(!ticker) ticker = setInterval(pomoTick, 500);
    }
    pomoCommit(); renderPomo();
  });
  $("#pomoReset").addEventListener("click", ()=>{ pomo.left = pomo.dur; clearInterval(ticker); ticker=null; pomo.running=false; delete pomo.endAt; pomoCommit(); renderPomo(); });
  $("#pomoSkip").addEventListener("click", ()=>{ clearInterval(ticker); ticker=null; pomo.running=false; delete pomo.endAt; pomoNext(); });
  document.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click", ()=>{
    pomo.mode = b.dataset.m; pomo.dur = POMO[pomo.mode]; pomo.left = pomo.dur;
    clearInterval(ticker); ticker = null; pomo.running = false; delete pomo.endAt;
    pomoCommit(); renderPomo();
  }));
}

  $("#wOk").addEventListener("click", ()=>{
    const i = state.wrong.indexOf(w);
    if(i>=0) state.wrong.splice(i,1);
    save(); closeModal(); renderNotes(); toast("答对了，已移出错题本 💪");
  });
  $("#wAgain").addEventListener("click", ()=>{
    const i = state.wrong.indexOf(w);
    if(i>=0){ state.wrong[i].times = (state.wrong[i].times||0)+1; save(); }
    closeModal(); renderNotes(); toast("已标记：这题还需再攻 ✍️");
  });
}

/* ============ Tab 与主题 ============ */
const RENDER = { dash: renderDash, tasks: renderTasks, pomo: renderPomo, notes: renderNotes, res: renderRes };
const TAB_ORDER = ["dash","tasks","pomo","notes","res"];
const TAB_NAME  = { dash:"仪表盘", tasks:"路线任务", pomo:"番茄钟", notes:"笔记日志", res:"资源" };
function renderActive(){
  const t = document.querySelector(".tab.active");
  if(t && RENDER[t.dataset.tab]) RENDER[t.dataset.tab]();
}
function gotoTab(name){
  const t = document.querySelector(`.tab[data-tab="${name}"]`);
  if(t && !t.classList.contains("active")) t.click();
}
$("#tabs").addEventListener("click", e=>{
  const b = e.target.closest(".tab"); if(!b) return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  RENDER[b.dataset.tab]();
  /* 记住当前页：刷新/回退后仍停留在原页面，也支持 #tasks 直达 */
  if(location.hash !== "#" + b.dataset.tab) history.replaceState(null, "", "#" + b.dataset.tab);
});
/* 键盘快捷键：1-6 切换页面，/ 聚焦搜索 */
document.addEventListener("keydown", e=>{
  const tg = e.target;
  const typing = tg && tg !== document && typeof tg.matches === "function" && tg.matches("input,textarea");
  if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key === "/"){ e.preventDefault(); $searchInput.focus(); return; }
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= TAB_ORDER.length) gotoTab(TAB_ORDER[n-1]);
});
document.addEventListener("click", e=>{
  const g = e.target.closest("[data-go]"); if(!g) return;
  const t = document.querySelector(`.tab[data-tab="${g.dataset.go}"]`);
  if(t) t.click();
});
function applyTheme(){
  document.documentElement.dataset.theme = state.theme;
  $("#themeBtn").textContent = state.theme === "dark" ? "☀️ 浅色" : "🌙 深色";
}
$("#themeBtn").addEventListener("click", ()=>{
  state.theme = state.theme === "dark" ? "light" : "dark";
  save(); applyTheme();
});

/* ============ 导出 / 导入 / 快照 / 重置 ============ */
$("#exportBtn").addEventListener("click", ()=>{
  /* 备份是静态快照：强制去掉运行中状态，避免导入后按钮显示错乱 */
  const blob = new Blob([JSON.stringify(makeDump(), null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `学习平台备份_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  markBackup();
  toast("已导出备份");
});
$("#tipExport").addEventListener("click", ()=>$("#exportBtn").click());
$("#tipClose").addEventListener("click", ()=>{
  $("#backupTip").style.display = "none";
  state.lastBackup = new Date().toISOString(); save();
});
$("#importBtn").addEventListener("click", ()=>$("#importFile").click());
function makeDump(){
  const dump = { ...state, pomo: { ...pomo, running:false }, pomoTotal };
  delete dump.pomo.endAt;
  return dump;
}
function snapshot(kind){ /* kind: daily 每日 | import 导入前 | reset 重置前 */
  try {
    localStorage.setItem("bdlp_snap_" + kind, JSON.stringify({ at: new Date().toISOString(), data: makeDump() }));
  } catch(e){}
}
const SNAP_LABEL = { daily:"每日自动快照", import:"导入前快照", reset:"重置前快照" };
function openSnapshots(){
  $("#mTag").textContent = "数据保护";
  $("#mTitle").textContent = "🛟 本地快照恢复";
  const rows = Object.keys(SNAP_LABEL).map(k=>{
    const raw = LS_OK ? store.get("bdlp_snap_"+k, null) : null;
    if(!raw) return `<div class="snap-row"><div><b>${SNAP_LABEL[k]}</b><br><span class="muted">暂无</span></div><button class="btn ghost small" disabled>不可用</button></div>`;
    const done = TASK_IDS.filter(id=>raw.data.tasks && raw.data.tasks[id]).length;
    const at = new Date(raw.at).toLocaleString("zh-CN");
    return `<div class="snap-row"><div><b>${SNAP_LABEL[k]}</b><br><span class="muted">${esc(at)} · 已完成 ${done} 个任务</span></div><button class="btn primary small" data-snap="${k}">恢复</button></div>`;
  }).join("");
  $("#mBody").innerHTML = `
    <div class="intro">快照保存在本浏览器，是防误操作的"后悔药"：<b>重置、导入覆盖前会自动留一份</b>，每天首次打开也会自动存一份。误删数据时可从这里找回。</div>
    ${rows}
    <p class="muted" style="font-size:12.5px;margin:12px 0 0">恢复会用快照内容替换当前数据；恢复前建议先点"导出备份"留存当前数据。</p>`;
  $("#modal").classList.add("show");
  document.body.style.overflow = "hidden";
  document.querySelectorAll("[data-snap]").forEach(b=>b.addEventListener("click", ()=>{
    const k = b.dataset.snap, raw = store.get("bdlp_snap_"+k, null);
    if(!raw) return;
    if(!confirm(`用「${SNAP_LABEL[k]}」的内容替换当前全部数据？\n（恢复前建议先导出备份留存当前数据）`)) return;
    applyBackup(raw.data, true);
    closeModal();
    toast("快照恢复完成 ✓");
  }));
}
$("#snapBtn").addEventListener("click", openSnapshots);

/* 把备份 JSON 应用到当前状态（导入与快照恢复共用），含基本数据校验 */
function applyBackup(data, replaceAll){
  const isObj = x => x && typeof x === "object" && !Array.isArray(x);
  const pick = (obj, valid) => { const out={}; if(isObj(obj)) for(const k of valid) if(k in obj) out[k]=obj[k]; return out; };
  state.tasks    = pick(data.tasks, TASK_IDS);
  state.mastery  = pick(data.mastery, TASK_IDS);
  if(isObj(data.checkins)) state.checkins = data.checkins;
  if(typeof data.notes === "string") state.notes = data.notes;
  if(Array.isArray(data.logs))  state.logs  = data.logs.filter(x=>x && typeof x.text==="string");
  if(Array.isArray(data.wrong)) state.wrong = data.wrong.filter(x=>x && typeof x.quiz==="string");
  if(isObj(data.pomo)){ pomo = { ...DEF.pomo, ...data.pomo, running:false }; delete pomo.endAt; state.pomo = pomo; }
  if(Number.isFinite(data.pomoTotal)) pomoTotal = data.pomoTotal;
  if(typeof data.lastBackup === "string") state.lastBackup = data.lastBackup;
  if(replaceAll && typeof data.theme === "string") state.theme = data.theme;
  save(); renderActive();
}
$("#importFile").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    let data;
    try { data = JSON.parse(r.result); } catch(err){ return toast("导入失败：文件格式不对"); }
    if(!confirm("导入规则：任务勾选、技能进度、掌握度、打卡 = 合并；笔记、日志、错题本 = 被备份整体替换。\n\n当前数据已自动存为快照（🛟 可找回）。\n确定继续导入？")) return;
    snapshot("import");
    applyBackup(data, false);
    toast("导入成功 ✓");
  };
  r.readAsText(f); e.target.value = "";
});
$("#resetBtn").addEventListener("click", ()=>{
  if(!confirm("确定清空所有学习数据？\n（清空前会自动存一份「重置前快照」，可在 🛟 快照恢复 找回）")) return;
  snapshot("reset");
  localStorage.removeItem("bdlp_v1"); localStorage.removeItem("bdlp_pomoTotal");
  location.reload();
});

/* ============ 全局搜索 ============ */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  const idx = [];
  for(const st of STAGES) st.tasks.forEach(([name,desc],i)=>{
    const key = `${st.id}_${i}`;
    idx.push({ key, tag: st.badge, title: name, text: `${name} ${desc} ${(DETAILS[key]?.pts||[]).join(" ")} ${(DETAILS[key]?.pit||"")} ${(DETAILS[key]?.deep?.go||"")} ${(DETAILS[key]?.deep?.tasks||[]).join(" ")}` });
  });
  for(const [k, terms] of Object.entries(TERMS)){
    idx.push({ key:k, tag:"名词", title: terms[0][0], text: terms.map(t=>t[0]+t[1]).join(" ") });
  }
  searchIndex = idx;
  return idx;
}
const $searchInput = $("#searchInput"), $searchRes = $("#searchRes");
function hl(text, q){
  const t = String(text), i = t.toLowerCase().indexOf(q);
  if(i < 0) return esc(t);
  return esc(t.slice(0,i)) + "<mark>" + esc(t.slice(i, i+q.length)) + "</mark>" + esc(t.slice(i+q.length));
}
$searchInput.addEventListener("input", ()=>{
  const q = $searchInput.value.trim().toLowerCase();
  if(!q){ $searchRes.classList.remove("show"); return; }
  const hits = buildSearchIndex().filter(x=>x.text.toLowerCase().includes(q) || x.title.toLowerCase().includes(q)).slice(0,12);
  $searchRes.innerHTML = hits.length ? hits.map(h=>`
    <div class="sr-item" data-k="${h.key}"><span class="sg">${h.tag}</span><span class="st">${hl(h.title, q)}</span></div>
  `).join("") : `<div class="sr-empty">没有找到「${esc($searchInput.value)}」，换个关键词试试</div>`;
  $searchRes.classList.add("show");
});
$searchRes.addEventListener("click", e=>{
  const it = e.target.closest(".sr-item"); if(!it) return;
  $searchRes.classList.remove("show");
  $searchInput.value = "";
  openDetail(it.dataset.k);
});
document.addEventListener("click", e=>{ if(!e.target.closest(".search-wrap")) $searchRes.classList.remove("show"); });
$searchInput.addEventListener("keydown", e=>{ if(e.key==="Enter"){ const first=$searchRes.querySelector(".sr-item"); if(first){ $searchRes.classList.remove("show"); $searchInput.value=""; openDetail(first.dataset.k);} } });

/* ============ 初始化 ============ */
applyTheme();
renderDash();
/* 首次打开：弹一次「数据仅存本机」说明（之后不再打扰） */
maybeFirstVisitTip();
/* 存储不可用（无痕/隐私模式）→ 顶部红色警告，避免学习一天全白费 */
if(!LS_OK) $("#lsWarn").style.display = "flex";
/* 每日自动快照：一天一份滚动覆盖，作为"清缓存/误操作前的最后防线" */
if(LS_OK && store.get("bdlp_snap_day","") !== todayStr()){
  snapshot("daily");
  store.set("bdlp_snap_day", todayStr());
}
/* 番茄钟若在计时（刷新/重开页面后）：恢复计时器 */
if(pomo.running && !ticker) ticker = setInterval(pomoTick, 500);
/* 从后台切回标签页时立即校准倒计时 */
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && pomo.running) pomoTick(); });
/* 支持 #tasks 等直达链接 */
(()=>{
  const h = location.hash.replace("#","");
  if(TAB_ORDER.includes(h) && h !== "dash") gotoTab(h);
})();
window.addEventListener("beforeunload", ()=>{ clearInterval(ticker); pomoCommit(); });

</script>
